<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Схема проезда: Владивосток, улица Калинина, 275А">
  <defs>
    <pattern id="park" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v14" stroke="#20262B" stroke-width="2"/>
    </pattern>
    <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0F"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#mapbg)"/>

  <!-- ===== Кварталы ===== -->
  <g fill="#131318" stroke="#1F1F26" stroke-width="1.5">
    <!-- северо-запад, над ул. Калинина -->
    <rect x="20" y="30" width="228" height="112"/>
    <rect x="300" y="30" width="248" height="112"/>
    <rect x="20" y="186" width="228" height="34"/>
    <rect x="300" y="186" width="248" height="34"/>

    <!-- между ул. Калинина и шоссе -->
    <rect x="20" y="294" width="200" height="140"/>
    <rect x="240" y="294" width="140" height="70"/>
    <rect x="400" y="294" width="148" height="36"/>

    <!-- северо-восток -->
    <rect x="610" y="40" width="210" height="160"/>
    <rect x="840" y="40" width="140" height="110"/>
    <rect x="1055" y="30" width="145" height="90"/>

    <!-- между шоссе и ул. Калинина (восток) -->
    <rect x="660" y="408" width="160" height="30"/>
    <rect x="900" y="360" width="300" height="78"/>

    <!-- юг: корпус 275А и соседний -->
    <rect x="610" y="505" width="330" height="85"/>
    <rect x="975" y="505" width="225" height="85"/>

    <!-- юго-запад -->
    <rect x="20" y="630" width="360" height="150"/>
    <rect x="20" y="800" width="360" height="70"/>
    <rect x="420" y="500" width="130" height="300"/>
  </g>

  <!-- Парк «Зелёный остров» -->
  <rect x="600" y="660" width="220" height="130" fill="url(#park)" stroke="#24242C"/>

  <!-- ===== Корпус 275А ===== -->
  <rect x="635" y="520" width="285" height="55" fill="#1A1A21" stroke="#C4501B" stroke-opacity="0.85" stroke-width="2"/>

  <!-- ===== Крупные здания внутри кварталов ===== -->
  <g fill="#1A1A21" stroke="#26262E" stroke-width="1">
    <rect x="60" y="660" width="130" height="46"/>
    <rect x="220" y="652" width="120" height="60"/>
    <rect x="70" y="816" width="110" height="40"/>
    <rect x="640" y="60" width="120" height="52"/>
    <rect x="920" y="386" width="120" height="40"/>
    <rect x="1010" y="520" width="120" height="52"/>
    <rect x="450" y="530" width="70" height="240"/>
  </g>

  <!-- ===== Шоссе (широкое, по диагонали) ===== -->
  <g>
    <path d="M-20 560 L1220 180" stroke="#1F1F26" stroke-width="94"/>
    <path d="M-20 560 L1220 180" stroke="#0D0D11" stroke-width="88"/>
    <path d="M-20 516 L1220 136" stroke="#2A2A33" stroke-width="1.2"/>
    <path d="M-20 604 L1220 224" stroke="#2A2A33" stroke-width="1.2"/>
    <path d="M-20 560 L1220 180" stroke="#2E2E36" stroke-width="2" stroke-dasharray="16 20"/>
  </g>

  <!-- ===== улица Калинина (две ветки) ===== -->
  <g>
    <rect x="-10" y="250" width="600" height="36" fill="#0D0D11"/>
    <path d="M0 250h585M0 286h585" stroke="#2A2A33" stroke-width="1.2"/>
    <path d="M0 268h585" stroke="#2E2E36" stroke-width="1.6" stroke-dasharray="12 14"/>

    <rect x="585" y="445" width="640" height="38" fill="#0D0D11"/>
    <path d="M585 445h635M585 483h635" stroke="#2A2A33" stroke-width="1.2"/>
    <path d="M585 464h635" stroke="#2E2E36" stroke-width="1.6" stroke-dasharray="12 14"/>
  </g>

  <!-- ===== Сипиловский овраг ===== -->
  <g>
    <rect x="560" y="-10" width="36" height="340" fill="#0D0D11"/>
    <path d="M560 -10v330M596 -10v330" stroke="#2A2A33" stroke-width="1.2"/>
    <path d="M578 -10v330" stroke="#2E2E36" stroke-width="1.6" stroke-dasharray="12 14"/>
  </g>

  <!-- ===== Локальные улицы ===== -->
  <g fill="#0D0D11">
    <rect x="-10" y="150" width="600" height="28"/>
    <rect x="260" y="-10" width="28" height="260"/>
    <rect x="1010" y="230" width="28" height="215"/>
    <rect x="944" y="445" width="24" height="170"/>
  </g>
  <g stroke="#2E2E36" stroke-width="1.2" stroke-dasharray="10 12">
    <path d="M0 164h580"/>
    <path d="M274 0v240"/>
    <path d="M1024 236v209"/>
  </g>
  <path d="M596 460 L860 650 L1220 700" fill="none" stroke="#1F1F26" stroke-width="32"/>
  <path d="M596 460 L860 650 L1220 700" fill="none" stroke="#0D0D11" stroke-width="28"/>
  <path d="M596 460 L860 650 L1220 700" fill="none" stroke="#2E2E36" stroke-width="1.4" stroke-dasharray="10 12"/>

  <!-- ===== Железная дорога ===== -->
  <path d="M0 792 L600 812" fill="none" stroke="#383840" stroke-width="2.5" stroke-dasharray="14 9"/>

  <!-- ===== Маршрут к офису ===== -->
  <path d="M-10 700 C 250 690 480 660 640 560 S 700 570 756 552"
        fill="none" stroke="#C4501B" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- ===== Подписи номеров домов ===== -->
  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="60" y="60" width="80" height="9"/>
    <rect x="340" y="60" width="60" height="8"/>
    <rect x="640" y="70" width="90" height="8"/>
    <rect x="870" y="70" width="70" height="8"/>
    <rect x="1080" y="60" width="70" height="8"/>
    <rect x="60" y="680" width="90" height="8"/>
    <rect x="930" y="530" width="80" height="8"/>
  </g>
</svg>
